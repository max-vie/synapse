name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly dependency/security hygiene run; keeps image scans and SBOMs fresh.
    - cron: '0 9 1 * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # Tool versions and checksums are pinned for reproducible, reviewer-safe CI runs.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  TRIVY_IMAGE: aquasec/trivy:0.66.0
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # Pinned to actions/checkout v4.3.1 for supply-chain hardening.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install CI tools
        run: |
          tools_dir="${RUNNER_TEMP:-/tmp}/synapse-ci-tools"
          mkdir -p "$tools_dir"
          scripts/ci/install-release-tool.sh \
            gitleaks/gitleaks \
            "${GITLEAKS_VERSION}" \
            "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${GITLEAKS_SHA256}" \
            gitleaks \
            "$tools_dir"
          scripts/ci/install-release-tool.sh \
            rhysd/actionlint \
            "${ACTIONLINT_VERSION}" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "${ACTIONLINT_SHA256}" \
            actionlint \
            "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: GitHub Actions lint
        run: actionlint

      - name: Secret scan
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          mkdir "$tmp_dir/source"
          git ls-files -z | tar --null --files-from - -cf - | tar -xf - -C "$tmp_dir/source"
          gitleaks detect --source "$tmp_dir/source" --no-git --redact --verbose

      - name: Shell scripts
        run: shellcheck scripts/ci/*.sh

  dependency-security:
    name: Dependency security and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        # Pinned to actions/checkout v4.3.1 for supply-chain hardening.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Python setup
        # Pinned to actions/setup-python v5.6.0 for supply-chain hardening.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate SBOMs and scan pinned images with Trivy
        run: scripts/ci/scan-images.sh .local-artifacts/sbom

      - name: Upload generated SBOM artifact
        if: always()
        # Pinned to actions/upload-artifact v4.6.2 for supply-chain hardening.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synapse-image-sboms
          path: .local-artifacts/sbom/*.cdx.json
          if-no-files-found: error

  test:
    name: Test suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Check out repository
        # Pinned to actions/checkout v4.3.1 for supply-chain hardening.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Python setup
        # Pinned to actions/setup-python v5.6.0 for supply-chain hardening.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Python syntax
        run: python -m compileall -q src Ask scripts tests

      - name: Safe demo
        run: python scripts/demo.py

      - name: Tests
        run: python -m pytest -q

  mocked-fastapi-qdrant-e2e:
    name: Mocked FastAPI/Qdrant e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        # Pinned to actions/checkout v4.3.1 for supply-chain hardening.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Python setup
        # Pinned to actions/setup-python v5.6.0 for supply-chain hardening.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mocked FastAPI/Qdrant service proof
        run: make mocked-fastapi-qdrant-e2e

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # Pinned to actions/checkout v4.3.1 for supply-chain hardening.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Python setup
        # Pinned to actions/setup-python v5.6.0 for supply-chain hardening.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Public hygiene
        run: |
          python -m scripts.checks repo .

      - name: Docs links
        run: python -m scripts.checks docs .

      - name: Compose config
        run: |
          env \
            WIKIJS_DB_PASSWORD=dummy-ci-placeholder-password \
            SYNAPSE_WEBHOOK_AUTH_TOKEN=dummy-ci-placeholder-webhook-token \
            docker compose -f docker-compose.e2e.yml config >/tmp/synapse-compose-config.yml
          docker compose -f docker-compose.ci-e2e.yml config >/tmp/synapse-ci-e2e-compose-config.yml

      - name: Clean working tree
        run: |
          git diff --check
          git diff --exit-code -- .
