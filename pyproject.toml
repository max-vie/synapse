[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-local-lab"
dynamic = ["version"]
description = "Local Markdown-to-RAG infrastructure lab"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "max-vie", email = "mitterbauer05@gmail.com"}]
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "PyYAML==6.0.2",
  "httpx==0.28.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "synapse._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src", "Ask", "."]
